<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视界滞后 - 战术平面图</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
 
<div id="game-container">
    <div class="hud-overlay">
        <div class="status-box">
            <div>VITALS // 装甲/生命值</div>
            <div class="bar-outer"><div class="bar-inner" id="player-hp-bar"></div></div>
            
            <div style="margin-top: 6px;">SHIELD // 防暴盾 [SHIFT]</div>
            <div class="bar-outer"><div class="bar-inner shield" id="player-shield-bar"></div></div>

            <div style="margin-top: 6px;" id="blind-label">BLIND ENERGY // 盲区能量 [SPACE]</div>
            <div class="bar-outer"><div class="bar-inner blind" id="blind-energy-bar"></div></div>
        </div>
        
        <div class="status-box" style="text-align: right; margin-right: 60px; margin-top: 10px;">
            <div id="wave-title">WAVE: 1</div>
            <div id="enemies-left" style="color: #FF3344; margin-top: 4px;">HOSTILES: 0</div>
            <div id="score-count" style="margin-top: 4px; color: #88FFBB;">KILLS: 0</div>
        </div>
    </div>

    <div id="alarm-banner"> AIRPORT SECURITY ALARM - ALL SECTORS ALERTED </div>

    <div id="game-over-screen">
        <h1 id="over-title">MISSION FAILED</h1>
        <p id="over-desc">OPERATIVE ELIMINATED IN ACTION.</p>
        <button class="restart-btn" onclick="resetGame()">[ R ] RESTART OPERATION</button>
    </div>

    <canvas id="canvas"></canvas>
    <div class="log-panel" id="log-panel">
        <div>> TACTICAL OPERATIONS INITIALIZED.</div>
    </div>
</div>

<!-- 脚本依次加载：关卡数据 -> 关卡管理器 -> 游戏引擎 -->
<script src="js/levels/level1_airport.js"></script>
<script src="js/levels/level2_subway.js"></script>
<script src="js/levelManager.js"></script>
<script src="js/engine.js"></script>
</body>
</html>
